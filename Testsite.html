<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Santino Dynamics Store</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #000; color: white; }

header {
  background: #000;
  padding: 20px;
  border-bottom: 1px solid gold;
  display: flex;
  align-items: center;
  justify-content: center; 
  gap: 15px;
}

.logo {
  width: 85px;
  height: 85px;
  object-fit: contain;
  border-radius: 50%;
}

.title-area {
  text-align: center; 
}

.title-area h1 {
  margin: 0;
  color: gold; 
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 1px;
}

.title-area .slogan {
  margin-top: 3px;
  font-size: 14px;
  color: gold; 
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* Products */
.products { display: flex; justify-content: center; margin: 20px; flex-wrap: wrap; }
.product { background: white; color: black; border: 1px solid #ccc; border-radius: 8px; width: 220px; margin: 10px; padding: 10px;
text-align: center; box-shadow: 0 0 8px rgba(255,215,0,0.5); }
.product img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
button { background: gold; color: black; border: none; margin-top: 10px; cursor: pointer; font-weight: bold; }
button:hover { background: #e6c300; }

/* Cart and Order Form */
.cart, .order-form { 
  margin: 20px; 
  padding: 15px; 
  background: #111; 
  border: 1px solid gold; 
  border-radius: 8px; 
  color: gold; /* default text color for all inside */
}

.cart h2, .order-form h2 {
  color: gold;
  margin-bottom: 10px;
}

.cart ul li {
  color: gold;
}

/* Order Form specific styling */
.order-form label {
  display: block;
  margin-top: 10px;
  color: gold;
}

.order-form input, 
.order-form textarea, 
.order-form select {
  width: 100%; 
  padding: 8px; 
  margin-top: 5px; 
  border-radius: 5px; 
  border: 1px solid gold; 
  background: #111;
  color: gold;
}

.order-form button {
  width: 100%;
  padding: 8px;
  background: gold;
  color: black;
  border: none;
  margin-top: 10px;
  cursor: pointer;
  font-weight: bold;
}

.order-form button:hover {
  background: #e6c300;
}

</style>
</head>
<body>

<header>
  <img src="C:\Users\UDMCL3-03\Desktop\FinalProjectaldrin\logo.png.png" alt="Santino Dynamics Logo" class="logo">
  <div class="title-area">
    <h1>Santino Dynamics</h1>
    <p class="slogan">Master of Terrain</p>
  </div>
</header>

<section class="products">
  <div class="product">
    <img src="C:\Users\UDMCL3-03\Desktop\FinalProjectaldrin\images.jpg" alt="Sedan">
    <h3>Sedan</h3>
    <p>USD 300,000</p>
    <button onclick="addToCart('Sedan',300000)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="C:\Users\UDMCL3-03\Desktop\FinalProjectaldrin\terra-gray.png.ximg.l_6_m.smart.png"" alt="SUV">
    <h3>SUV</h3>
    <p>USD 450,000</p>
    <button onclick="addToCart('SUV',450000)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="C:\Users\UDMCL3-03\Desktop\FinalProjectaldrin\cas-40-tatra-t815-10x10-1.jpg" alt="Emergency Vehicles">
    <h3>Emergency Vehicles</h3>
    <p>USD 350,000</p>
    <button onclick="addToCart('Emergency Vehicles', 350000)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="C:\Users\UDMCL3-03\Desktop\FinalProjectaldrin\bumerang_2.jpg" alt="Armored Vehicles">
    <h3>Armored Vehicles</h3>
    <p>USD 700,000</p>
    <button onclick="addToCart('Armored Vehicles',700000)">Add to Cart</button>
  </div>
</section>

<section class="cart">
  <h2>Shopping Cart</h2>
  <ul id="cart-items"></ul>
  <p><strong>Total: USD <span id="cart-total">0</span></strong></p>
</section>

<section class="order-form">
  <h2>Order Form</h2>
  <form onsubmit="submitOrder(event)">
    <label for="name">Full Name</label>
    <input type="text" id="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" required>

    <label for="address">Shipping Address</label>
    <textarea id="address" required></textarea>

    <label for="payment">Payment Method</label>
    <select id="payment">
      <option value="COD">Cash on Delivery</option>
      <option value="GCash">GCash</option>
      <option value="Bank">Bank Transfer</option>
    </select>

    <button type="submit">Submit Order</button>
  </form>
</section>

<script>
let cart = [];

function addToCart(product, price) {
    cart.push({ product, price });
    displayCart();
}

function displayCart() {
    const cartItems = document.getElementById('cart-items');
    cartItems.innerHTML = '';
    let total = 0;

    cart.forEach(item => {
        let li = document.createElement('li');
        li.textContent = `${item.product} - USD ${item.price.toLocaleString()}`;
        cartItems.appendChild(li);
        total += item.price;
    });

    document.getElementById('cart-total').textContent = total.toLocaleString();
}

function submitOrder(event) {
    event.preventDefault();

    if (cart.length === 0) { 
        alert("Your cart is empty!"); 
        return; 
    }

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const address = document.getElementById('address').value;
    const payment = document.getElementById('payment').value;

    let orderSummary = cart.map(item => `- ${item.product} USD ${item.price.toLocaleString()}`).join("\n");
    let total = cart.reduce((sum, item) => sum + item.price, 0).toLocaleString();

    alert(`Thank you, ${name}!\n\nOrder Summary:\n${orderSummary}\n\nTotal: USD ${total}\nPayment Method: ${payment}\n\nWe will ship to:\n${address}`);

    cart = [];
    displayCart();
    document.querySelector("form").reset();
}
</script>

</body>
</html>
